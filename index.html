<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tabungan Saya</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap"><style id="css">
:root{--bg:#eef3ef;--ink:#14302b;--card:#fff;--mut:#5b716b;--in:#2b7a58;--out:#c2492f;--gold:#e0a526;--line:#d5e0da;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b18;--ink:#e6f1ec;--card:#182925;--mut:#93aaa3;--in:#4fc08d;--out:#ff8a6b;--line:#2a403a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b18;--ink:#e6f1ec;--card:#182925;--mut:#93aaa3;--in:#4fc08d;--out:#ff8a6b;--line:#2a403a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.6rem;font-weight:800;margin:8px 0}h2{font-size:1.1rem;margin:0 0 10px}
.card{background:var(--card);border-radius:20px;padding:18px;margin:14px 0;border:1px solid var(--line)}
.hero{background:#14302b;color:#fff;border-bottom:5px solid var(--gold)}
.hero .lbl{opacity:.8}.big{font-size:2.2rem;font-weight:800;letter-spacing:-.5px}.big.neg{color:#ff9a80}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.two b{display:block;font-size:1.1rem}
#tin{color:#7fe0b2}#tout{color:#ff9a80}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.bar label{flex:1;min-width:150px}
label{display:block;font-weight:600;font-size:.9rem;color:var(--mut)}
input,select{width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.f{display:grid;gap:10px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--ink);color:var(--bg)}
button.in{background:var(--in);color:#fff}button.out{background:var(--out);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.msg{min-height:1.3em;margin-top:8px;font-size:.92rem;color:var(--out)}.msg.ok{color:var(--in)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px}
.tabs button.on{background:var(--gold);color:#14302b;border-color:var(--gold)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}td.k{white-space:normal;min-width:120px}
td.a,th.a{text-align:right}.p{color:var(--in);font-weight:600}.m{color:var(--out);font-weight:600}
.del{background:transparent;border:0;padding:6px;color:var(--out)}.del svg{width:20px;height:20px;display:block}
.del.q{border:1px solid var(--out);border-radius:10px;font-size:.8rem}
small,.note{color:var(--mut);font-size:.85rem}
#login{min-height:80vh;display:grid;place-content:center;text-align:center;gap:12px;padding:16px}
#login .card{min-width:min(340px,86vw)}.hide{display:none!important}
.seg{display:flex;gap:6px;margin:12px 0}.seg button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:12px;font-weight:800}.seg button.on{background:var(--gold);color:#14302b;border-color:var(--gold)}
</style></head><body><div id="root"></div><template id="tpl">
<div id="login"><div class="card"><h1>Tabungan Saya</h1><p>Masuk sebagai:</p>
<div class="f"><button id="bv" class="in">Viewer</button><button id="ba" class="ghost">Admin</button></div>
<div id="pinbox" class="f hide" style="margin-top:12px"><label>PIN admin<input id="pin" type="password" autocomplete="off" placeholder="Huruf atau angka"></label><button id="bp">Masuk</button></div>
<div class="msg" id="lmsg"></div><p class="note">Catatan jujur: PIN hanya pengaman tampilan, bukan keamanan sungguhan.</p></div></div>
<div id="app" class="wrap hide">
<header><h1>Tabungan <span class="own"></span></h1><button id="out" class="ghost">Keluar</button></header>
<div class="seg" id="who"><button id="w1" class="on"></button><button id="w2"></button></div><section class="card hero"><div class="lbl">Saldo tabungan</div><div id="bal" class="big"></div>
<div class="two"><div>Total pemasukan<b id="tin"></b></div><div>Total pengeluaran<b id="tout"></b></div></div></section>
<section class="card bar"><label>Periode<select id="per"></select></label><button id="pdf"></button></section>
<div id="forms">
<section class="card"><h2 id="hi">Catat pemasukan</h2><div class="f"><label>Tanggal<input type="date" id="di"></label><label>Jumlah (Rp)<input id="ai" inputmode="numeric" placeholder="0"></label><label>Keterangan<input id="ki" placeholder="Contoh: gaji"></label><button class="in" id="si">Simpan</button></div><div class="msg" id="mi"></div></section>
<section class="card"><h2 id="ho">Catat pengeluaran</h2><div class="f"><label>Tanggal<input type="date" id="do"></label><label>Jumlah (Rp)<input id="ao" inputmode="numeric" placeholder="0"></label><label>Keterangan<input id="ko" placeholder="Contoh: belanja"></label><button class="out" id="so">Simpan</button></div><div class="msg" id="mo"></div></section>
</div>
<section class="card"><h2>Riwayat</h2>
<div class="tabs"><button data-t="all" class="on">Semua</button><button data-t="in">Pemasukan</button><button data-t="out">Pengeluaran</button></div>
<div class="scroll"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th class="a">Jumlah</th><th class="adm">Action</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="msg" id="hmsg"></div><p class="note" id="st"></p></section>
<section class="card adm" id="set"><h2>Pengaturan admin</h2><div class="f"><label>Nama pemilik 1<input id="nm"></label><label>Nama pemilik 2<input id="nm2"></label><button id="bn" class="ghost">Simpan nama</button><div class="msg" id="mn"></div>
<label>PIN baru<input id="np" type="password" autocomplete="off" placeholder="Huruf atau angka, min. 4"></label><button id="bq" class="ghost">Ganti PIN</button><div class="msg" id="mq"></div>
<h2 style="margin-top:8px">Cadangan data</h2><button id="bx" class="ghost">Ekspor cadangan (JSON)</button><div class="msg" id="mx"></div><p class="note">Untuk memulihkan: unggah berkas cadangan ini ke Claude dan minta data dipulihkan. PIN tidak ikut diekspor (kembali ke PIN default).</p></div></section>
</div>
</template><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script id="js">
const $=id=>document.getElementById(id);
const DEFPIN='8559ae45d2529d8a9c8012902f2a2add9b178cafec87ef9cd8828c61e7b39e00';
const SRC={tpl:$('tpl').innerHTML};
let D={owner:'Fauzi',owner2:'Ayu',tx:[]},db=null,ready=false,who='1';
try{who=sessionStorage.getItem('who')==='2'?'2':'1'}catch(e){}
const cur=()=>who==='2'?D.owner2:D.owner,mine=x=>(x.w||'1')===who;
let role=null;try{role=sessionStorage.getItem('role')}catch(e){}
let per='all',tab='all',pend=null;
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const mname=k=>BLN[+k.slice(5,7)-1]+' '+k.slice(0,4);
const rp=n=>(n<0?'−Rp ':'Rp ')+Math.abs(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const dfmt=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
function show(id,t,ok){const e=$(id);if(e){e.textContent=t;e.className='msg'+(ok?' ok':'')}}
async function sha(s){if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const ERR={rate_limited:'Terlalu sering menyimpan, tunggu sebentar lalu coba lagi.',resource_exhausted:'Batas penyimpanan database tercapai.',invalid_argument:'Data tidak valid, coba lagi.'};
async function wr(msg,fn){
  if(!db){show(msg,'Database tidak tersedia. Buka halaman ini di claude.ai dan login sebagai pemilik.');return false}
  if(!ready){show(msg,'Data belum selesai dimuat, tunggu sebentar.');return false}
  show(msg,'Menyimpan…',true);
  try{await fn();show(msg,'Tersimpan.',true);return true}
  catch(e){show(msg,ERR[e&&e.code]||('Gagal menyimpan. Hanya pemilik yang sedang login yang bisa mengubah data'+(e&&e.code?' (kode: '+e.code+')':'')+'.'));return false}
}
const setS=p=>db.doc('settings/main').set({owner:D.owner,owner2:D.owner2,pin:D.pin||DEFPIN,...p});
const digits=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
async function add(t){
  const p=t==='in'?'i':'o',m='m'+p;
  const a=digits($('a'+p).value),d=$('d'+p).value||today();
  if(a<=0){show(m,'Isi jumlah lebih dari 0 dulu');return}
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),k=$('k'+p).value.trim()||(t==='in'?'Pemasukan':'Pengeluaran');
  if(await wr(m,()=>db.collection('tx').doc(id).set({t,d,a,k,w:who}))){$('a'+p).value='';$('k'+p).value=''}
}
async function del(id){
  if(pend!==id){pend=id;list();return}
  pend=null;await wr('hmsg',()=>db.collection('tx').doc(id).delete());list();
}
const filt=()=>D.tx.filter(x=>mine(x)&&(per==='all'||x.d.slice(0,7)===per));
const sum=(a,t)=>a.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
function list(){
  const adm=role==='admin';
  let a=filt().filter(x=>tab==='all'||x.t===tab).sort((x,y)=>y.d.localeCompare(x.d)||y.id.localeCompare(x.id));
  const T='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';
  $('rows').innerHTML=a.length?a.map(x=>'<tr><td>'+dfmt(x.d)+'</td><td class="k">'+esc(x.k)+'</td><td class="a '+(x.t==='in'?'p':'m')+'">'+(x.t==='in'?'+':'−')+rp(x.a)+'</td>'+(adm?'<td><button class="del'+(pend===x.id?' q':'')+'" data-id="'+x.id+'" aria-label="Hapus">'+(pend===x.id?'Yakin hapus?':T)+'</button></td>':'<td></td>')+'</tr>').join(''):'<tr><td colspan="4">Belum ada transaksi.</td></tr>';
  document.querySelectorAll('.adm').forEach(e=>e.classList.toggle('hide',!adm));
  document.querySelectorAll('#rows td:last-child').forEach(e=>{if(!adm)e.classList.add('hide')});
}
function render(){
  const all=D.tx.filter(mine),f=filt(),i=sum(f,'in'),o=sum(f,'out'),s=i-o;
  document.querySelectorAll('.own').forEach(e=>e.textContent=cur());$('w1').textContent=D.owner;$('w2').textContent=D.owner2;$('w1').classList.toggle('on',who==='1');$('w2').classList.toggle('on',who==='2');$('hi').textContent='Catat pemasukan — '+cur();$('ho').textContent='Catat pengeluaran — '+cur();
  $('bal').textContent=ready?rp(s):'Memuat…';$('bal').className='big'+(s<0?' neg':'');
  $('tin').textContent=ready?rp(i):'Memuat…';$('tout').textContent=ready?rp(o):'Memuat…';
  const ms=[...new Set(all.map(x=>x.d.slice(0,7)))].sort().reverse();
  if(per!=='all'&&!ms.includes(per))per='all';
  $('per').innerHTML='<option value="all">Semua bulan</option>'+ms.map(k=>'<option value="'+k+'"'+(k===per?' selected':'')+'>'+mname(k)+'</option>').join('');
  $('pdf').textContent=per==='all'?'Unduh PDF (semua bulan)':'Unduh PDF '+mname(per);
  $('forms').classList.toggle('hide',role!=='admin');
  $('st').textContent=db?(ready?'Tersambung ke database claude.ai; data tersimpan otomatis.':'Menghubungkan ke database…'):'Database tidak tersedia di tampilan ini.';
  list();
}
function setWho(w){who=w;per='all';pend=null;try{sessionStorage.setItem('who',w)}catch(e){}render()}
async function exportJson(){
  if(!ready){show('mx','Data belum selesai dimuat, tunggu sebentar.');return}
  try{
    const dl=await window.claude.use('downloads');
    if(!dl){show('mx','Unduhan tidak tersedia di tampilan ini. Buka halaman ini langsung di claude.ai.');return}
    const data={app:'tabungan-saya',versi:2,diekspor:new Date().toISOString(),owner:D.owner,owner2:D.owner2,tx:[...D.tx].sort((a,b)=>a.d.localeCompare(b.d)||a.id.localeCompare(b.id)).map(x=>({id:x.id,w:x.w||'1',t:x.t,d:x.d,a:x.a,k:x.k}))};
    await dl.save({filename:'cadangan-tabungan-'+today()+'.json',data:new Blob([JSON.stringify(data,null,1)],{type:'application/json'})});
    show('mx','Cadangan siap ('+data.tx.length+' transaksi).',true);
  }catch(e){show('mx',e&&e.code==='declined'?'Unduhan dibatalkan.':'Gagal membuat cadangan'+(e&&(e.code||e.message)?' ('+(e.code||e.message)+')':'')+'.')}
}
async function makePdf(){
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){show('hmsg','Pustaka PDF belum termuat. Periksa koneksi internet lalu coba lagi.');return}
  try{
    const doc=new J({unit:'mm',format:'a4'}),W=210,M=14,f=filt(),R=n=>(n<0?'-Rp ':'Rp ')+Math.abs(n).toLocaleString('id-ID');
    const DK=[20,48,43],GD=[224,165,38],GR=[43,122,88],RD=[194,73,47];
    const col=c=>doc.setTextColor(c[0],c[1],c[2]),fill=c=>doc.setFillColor(c[0],c[1],c[2]);
    const pl=per==='all'?'Semua bulan':mname(per);
    fill(DK);doc.rect(0,0,W,36,'F');fill(GD);doc.rect(0,36,W,1.6,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(20);doc.setTextColor(255,255,255);doc.text('Laporan Tabungan',M,15);
    doc.setFont('helvetica','normal');doc.setFontSize(10);
    doc.text('Pemilik: '+cur(),M,23);doc.text('Dicetak: '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),M,28);doc.text('Periode: '+pl,M,33);
    const i=sum(f,'in'),o=sum(f,'out'),s=i-o,cw=(W-2*M-8)/3;
    [['Total Pemasukan',i,GR],['Total Pengeluaran',o,RD],[per==='all'?'Saldo':'Selisih Bulan Ini',s,s<0?RD:DK]].forEach((c,n)=>{
      const x=M+n*(cw+4);fill([238,243,239]);doc.roundedRect(x,45,cw,22,3,3,'F');
      doc.setFont('helvetica','normal');doc.setFontSize(8.5);col([91,113,107]);doc.text(c[0],x+4,52);
      doc.setFont('helvetica','bold');doc.setFontSize(11.5);col(c[2]);doc.text(R(c[1]),x+4,61)});
    let y=76;const ens=h=>{if(y+h>280){doc.addPage();y=20}};
    const ms=[...new Set(f.map(x=>x.d.slice(0,7)))].sort();
    doc.setFont('helvetica','bold');doc.setFontSize(13);col(DK);doc.text('Rekap per bulan',M,y);y+=4;
    const hdr=(a,b,c,d)=>{fill(DK);doc.rect(M,y,W-2*M,7,'F');doc.setFontSize(9);doc.setTextColor(255,255,255);doc.text(a,M+2,y+5);doc.text(b,M+80,y+5,{align:'right'});doc.text(c,M+115,y+5,{align:'right'});doc.text(d,W-M-2,y+5,{align:'right'});y+=7};
    hdr('Bulan','Pemasukan','Pengeluaran','Selisih');
    ms.forEach(k=>{ens(8);const g=f.filter(x=>x.d.slice(0,7)===k),a=sum(g,'in'),b=sum(g,'out');
      doc.setFont('helvetica','normal');doc.setFontSize(9);col(DK);doc.text(mname(k),M+2,y+5);
      col(GR);doc.text(R(a),M+80,y+5,{align:'right'});col(RD);doc.text(R(b),M+115,y+5,{align:'right'});
      col(a-b<0?RD:DK);doc.text(R(a-b),W-M-2,y+5,{align:'right'});doc.setDrawColor(213,224,218);doc.line(M,y+7,W-M,y+7);y+=7});
    ens(9);fill(GD);doc.rect(M,y,W-2*M,8,'F');doc.setFont('helvetica','bold');doc.setFontSize(9.5);col(DK);
    doc.text('TOTAL',M+2,y+5.5);doc.text(R(i),M+80,y+5.5,{align:'right'});doc.text(R(o),M+115,y+5.5,{align:'right'});doc.text(R(s),W-M-2,y+5.5,{align:'right'});y+=15;
    ens(12);doc.setFontSize(13);col(DK);doc.text('Rincian transaksi',M,y);y+=5;
    if(!ms.length){doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Belum ada transaksi.',M,y+4)}
    ms.forEach(k=>{const g=f.filter(x=>x.d.slice(0,7)===k).sort((a,b)=>b.d.localeCompare(a.d));
      ens(18);fill(DK);doc.rect(M,y,W-2*M,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(255,255,255);
      doc.text(mname(k),M+2,y+5);doc.text('Masuk '+R(sum(g,'in'))+'  |  Keluar '+R(sum(g,'out')),W-M-2,y+5,{align:'right'});y+=7;
      g.forEach(x=>{const ln=doc.splitTextToSize(x.k,100),h=Math.max(6,ln.length*4.5+2);ens(h);
        doc.setFont('helvetica','normal');doc.setFontSize(9);col(DK);doc.text(dfmt(x.d),M+2,y+4.3);doc.text(ln,M+28,y+4.3);
        col(x.t==='in'?GR:RD);doc.text((x.t==='in'?'+':'-')+R(x.a),W-M-2,y+4.3,{align:'right'});
        doc.setDrawColor(213,224,218);doc.line(M,y+h,W-M,y+h);y+=h});y+=6});
    const n=doc.getNumberOfPages();
    for(let p=1;p<=n;p++){doc.setPage(p);fill(GD);doc.rect(M,286,W-2*M,.5,'F');doc.setFont('helvetica','normal');doc.setFontSize(8);col([91,113,107]);doc.text('Tabungan '+cur(),M,291);doc.text('Halaman '+p+' dari '+n,W-M,291,{align:'right'})}
    let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
    if(!dl){show('hmsg','Unduhan tidak tersedia di tampilan ini. Buka halaman ini langsung di claude.ai.');return}
    await dl.save({filename:'Laporan-Tabungan-'+cur()+'-'+(per==='all'?'semua-bulan':per)+'.pdf',data:doc.output('blob')});
    show('hmsg','PDF siap.',true);
  }catch(e){if(e&&e.code==='declined')show('hmsg','Unduhan dibatalkan.');else show('hmsg','Gagal membuat PDF'+(e&&(e.code||e.message)?' ('+(e.code||e.message)+')':'')+'.')}
}
function enter(r){role=r;try{sessionStorage.setItem('role',r)}catch(e){}view()}
function view(){$('login').classList.toggle('hide',!!role);$('app').classList.toggle('hide',!role);if(role){$('nm').value=D.owner;$('nm2').value=D.owner2;render()}}
function init(){
  $('root').innerHTML=SRC.tpl;
  $('bv').onclick=()=>enter('viewer');
  $('ba').onclick=()=>{$('pinbox').classList.remove('hide');$('pin').focus()};
  const go=async()=>{if(db&&!ready){show('lmsg','Memuat data, coba sebentar lagi.');return}try{const h=await sha($('pin').value);if(h===(D.pin||DEFPIN))enter('admin');else show('lmsg','PIN salah. Coba lagi.')}catch(e){show('lmsg','Peramban ini tidak bisa memeriksa PIN (SHA-256 tidak tersedia).')}};
  $('bp').onclick=go;$('pin').onkeydown=e=>{if(e.key==='Enter')go()};
  $('out').onclick=()=>{role=null;pend=null;try{sessionStorage.removeItem('role')}catch(e){}$('pin').value='';$('pinbox').classList.add('hide');show('lmsg','');view()};
  $('di').value=$('do').value=today();
  ['ai','ao'].forEach(id=>$(id).oninput=e=>{const n=digits(e.target.value);e.target.value=n?n.toLocaleString('id-ID'):''});
  $('si').onclick=()=>add('in');$('so').onclick=()=>add('out');
  $('per').onchange=e=>{per=e.target.value;pend=null;render()};
  $('pdf').onclick=makePdf;$('bx').onclick=exportJson;$('w1').onclick=()=>setWho('1');$('w2').onclick=()=>setWho('2');
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;pend=null;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));list()});
  $('rows').onclick=e=>{const b=e.target.closest('.del');if(b&&role==='admin')del(b.dataset.id)};
  $('bn').onclick=async()=>{const v=$('nm').value.trim(),v2=$('nm2').value.trim();if(!v||!v2){show('mn','Kedua nama tidak boleh kosong.');return}await wr('mn',()=>setS({owner:v,owner2:v2}))};
  $('bq').onclick=async()=>{const v=$('np').value;if(v.length<4){show('mq','PIN minimal 4 karakter.');return}
    let h;try{h=await sha(v)}catch(e){show('mq','Peramban ini tidak bisa membuat hash PIN.');return}
    if(await wr('mq',()=>setS({pin:h})))$('np').value=''};
  view();startDb();
}
async function startDb(){
  try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){show('lmsg','Database tidak tersedia. Buka halaman ini di claude.ai dan login.');if(role)render();return}
  let a=false,b=false;
  const chk=()=>{if(a&&b)ready=true;if($('nm')&&document.activeElement!==$('nm'))$('nm').value=D.owner;if($('nm2')&&document.activeElement!==$('nm2'))$('nm2').value=D.owner2;if(role)render()};
  const err=e=>show('hmsg','Galat database'+(e&&e.code?' (kode: '+e.code+')':'')+'. Muat ulang halaman.');
  db.doc('settings/main').onSnapshot(x=>{if(x.exists){const v=x.data();D.owner=v.owner||'Fauzi';D.owner2=v.owner2||'Ayu';D.pin=v.pin||null}a=true;chk()},err);
  db.collection('tx').onSnapshot(x=>{D.tx=x.docs.map(d=>({id:d.id,...d.data()}));b=true;chk()},err);
  setTimeout(()=>{if(!ready)show('hmsg','Memuat data terlalu lama. Muat ulang halaman.')},10000);
}
init();
</script></body></html>
