      col(a-b<0?RD:DK);doc.text(R(a-b),W-M-2,y+5,{align:'right'});doc.setDrawColor(211,230,251);doc.line(M,y+7,W-M,y+7);y+=7});
    ens(9);fill(GD);doc.rect(M,y,W-2*M,8,'F');doc.setFont('helvetica','bold');doc.setFontSize(9.5);col(DK);
    doc.text('TOTAL',M+2,y+5.5);doc.text(R(i),M+80,y+5.5,{align:'right'});doc.text(R(o),M+115,y+5.5,{align:'right'});doc.text(R(s),W-M-2,y+5.5,{align:'right'});y+=15;
    ens(12);doc.setFontSize(13);col(DK);doc.text('Rincian transaksi',M,y);y+=5;
    if(!ms.length){doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Belum ada transaksi.',M,y+4)}
    ms.forEach(k=>{const g=f.filter(x=>x.d.slice(0,7)===k).sort((a,b)=>b.d.localeCompare(a.d));
      ens(18);fill(DK);doc.rect(M,y,W-2*M,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(255,255,255);
      doc.text(mname(k),M+2,y+5);doc.text('Masuk '+R(sum(g,'in'))+'  |  Keluar '+R(sum(g,'out')),W-M-2,y+5,{align:'right'});y+=7;
      g.forEach(x=>{const ln=doc.splitTextToSize(x.k,100),h=Math.max(6,ln.length*4.5+2);ens(h);
        doc.setFont('helvetica','normal');doc.setFontSize(9);col(DK);doc.text(dfmt(x.d),M+2,y+4.3);doc.text(ln,M+28,y+4.3);
        col(x.t==='in'?GR:RD);doc.text((x.t==='in'?'+':'-')+R(x.a),W-M-2,y+4.3,{align:'right'});
        doc.setDrawColor(211,230,251);doc.line(M,y+h,W-M,y+h);y+=h});y+=6});
    const n=doc.getNumberOfPages();
    for(let p=1;p<=n;p++){doc.setPage(p);fill(GD);doc.rect(M,286,W-2*M,.5,'F');doc.setFont('helvetica','normal');doc.setFontSize(8);col([93,122,156]);doc.text('Tabungan '+cur(),M,291);doc.text('Halaman '+p+' dari '+n,W-M,291,{align:'right'})}
    doc.save('Laporan-Tabungan-'+cur()+'-'+(per==='all'?'semua-bulan':per)+'.pdf');
    show('hmsg','PDF siap.',true);
  }catch(e){if(e&&e.code==='declined')show('hmsg','Unduhan dibatalkan.');else show('hmsg','Gagal membuat PDF'+(e&&(e.code||e.message)?' ('+(e.code||e.message)+')':'')+'.')}
}
function enter(r){role=r;try{sessionStorage.setItem('role',r)}catch(e){}view()}
function view(){$('login').classList.toggle('hide',!!role);$('app').classList.toggle('hide',!role);if(role){$('nm').value=D.owner;$('nm2').value=D.owner2;render()}}
function init(){
  $('root').innerHTML=SRC.tpl;
  $('bv').onclick=()=>enter('viewer');
  $('ba').onclick=()=>{$('pinbox').classList.remove('hide');$('pin').focus()};
  const go=async()=>{if(db&&!ready){show('lmsg','Memuat data, coba sebentar lagi.');return}try{const h=await sha($('pin').value);if(h===(D.pin||DEFPIN))enter('admin');else show('lmsg','PIN salah. Coba lagi.')}catch(e){show('lmsg','Peramban ini tidak bisa memeriksa PIN (SHA-256 tidak tersedia).')}};
  $('bp').onclick=go;$('pin').onkeydown=e=>{if(e.key==='Enter')go()};
  $('out').onclick=()=>{role=null;pend=null;try{sessionStorage.removeItem('role')}catch(e){}$('pin').value='';$('pinbox').classList.add('hide');show('lmsg','');view()};
  $('di').value=$('do').value=today();
  ['ai','ao'].forEach(id=>$(id).oninput=e=>{const n=digits(e.target.value);e.target.value=n?n.toLocaleString('id-ID'):''});
  $('si').onclick=()=>add('in');$('so').onclick=()=>add('out');
  $('per').onchange=e=>{per=e.target.value;pend=null;render()};
  $('pdf').onclick=makePdf;$('bx').onclick=exportJson;$('bi').onclick=importJson;$('w1').onclick=()=>setWho('1');$('w2').onclick=()=>setWho('2');
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;pend=null;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));list()});
  $('rows').onclick=e=>{const b=e.target.closest('.del');if(b&&role==='admin')del(b.dataset.id)};
  $('bn').onclick=async()=>{const v=$('nm').value.trim(),v2=$('nm2').value.trim();if(!v||!v2){show('mn','Kedua nama tidak boleh kosong.');return}await wr('mn',x=>{x.owner=v;x.owner2=v2})};
  $('bq').onclick=async()=>{const v=$('np').value;if(v.length<4){show('mq','PIN minimal 4 karakter.');return}
    let h;try{h=await sha(v)}catch(e){show('mq','Peramban ini tidak bisa membuat hash PIN.');return}
    if(await wr('mq',x=>{x.pin=h}))$('np').value=''};
  view();startDb();
}
function upd(){
  document.querySelectorAll('.own').forEach(e=>e.textContent=cur());
  if($('nm')&&document.activeElement!==$('nm'))$('nm').value=D.owner;
  if($('nm2')&&document.activeElement!==$('nm2'))$('nm2').value=D.owner2;
  if(role)render()
}
async function mkDoc(){
  if(creating)return;creating=true;
  try{await fdb.runTransaction(async t=>{const x=await t.get(ref);if(!x.exists)t.set(ref,{json:ser({owner:'Fauzi',owner2:'Ayu',tx:[]})})})}
  catch(e){fstatus='Gagal membuat dokumen awal ('+(e.code||e.message)+')';upd()}
  creating=false
}
function startDb(){
  if(!window.firebase){fstatus='Pustaka Firebase gagal dimuat. Periksa koneksi internet.';show('lmsg',fstatus);upd();return}
  try{firebase.initializeApp(FB);fdb=firebase.firestore();ref=fdb.collection('tabungan').doc('state');db=fdb}
  catch(e){fstatus='Galat inisialisasi Firebase ('+(e.code||e.message)+')';upd();return}
  ref.onSnapshot({includeMetadataChanges:true},x=>{
    if(x.metadata.fromCache){fstatus='Menunggu data dari server…';upd();return}
    if(!x.exists){mkDoc();return}
    const n=norm(x.data().json);D.owner=n.owner;D.owner2=n.owner2;D.pin=n.pin;D.tx=n.tx;
    ready=true;fstatus='Tersambung ke server. Data tersinkron otomatis.';upd()
  },e=>{fstatus='Galat database ('+(e.code||'?')+'): '+(e.message||'');upd()});
  setTimeout(()=>{if(!ready){fstatus+=' Memuat terlalu lama, muat ulang halaman.';upd()}},12000);
}
init();
</script></body></html>
